name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save time and reduce noise.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel newer-JDK jobs if another leg fails. Each JDK gives useful signal.
      fail-fast: false
      matrix:
        jdk: ['17', '21', '25']
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: ${{ matrix.jdk }}
          cache: maven

      # Remove this bootstrap after the dependency moves from 4.6.0-SNAPSHOT to the published 4.6.0 release.
      - name: Check out Pyranid 4.6 snapshot
        uses: actions/checkout@v7
        with:
          repository: pyranid/pyranid
          ref: feature/4.6.0
          path: .pyranid-core

      - name: Install Pyranid 4.6 snapshot
        working-directory: .pyranid-core
        run: mvn -B -ntp -DskipTests install

      - name: Verify
        run: mvn -B -ntp verify

      - name: Build Javadoc
        run: mvn -B -ntp javadoc:javadoc
